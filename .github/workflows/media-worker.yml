name: Media Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'The Supabase Job ID or Project ID'
        required: true
        type: string
      type:
        description: 'The type of job to process (render or transcribe)'
        required: true
        type: choice
        options:
          - render
          - transcribe

jobs:
  process-media:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          # Use the lean requirements file for transcription, full file for render.
          # This avoids downloading mediapipe+opencv (~400MB) on transcription runs.
          cache-dependency-path: |
            server/requirements-transcribe.txt
            server/requirements.txt

      # Cache the faster-whisper 'base' model (~150MB from HuggingFace).
      # Stable key — only busts when model name changes.
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-base
          key: whisper-model-base-v1

      # ── TRANSCRIBE: only FFmpeg + Python, no Chrome deps ──────────────────
      # Chrome/Puppeteer system deps (libnss3, libasound2t64, etc.) are only
      # needed for render jobs. Skipping them saves ~12s on transcription runs.
      - name: Install system dependencies (transcribe — FFmpeg only)
        if: github.event.inputs.type == 'transcribe'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      # ── RENDER: FFmpeg + full Chrome deps ─────────────────────────────────
      - name: Install system dependencies (render — FFmpeg + Chrome)
        if: github.event.inputs.type == 'render'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      # ── TRANSCRIBE: pip install only faster-whisper (~50MB, already cached) ─
      # Skips mediapipe + opencv (~400MB) which are only needed for render.
      - name: Install Python dependencies (transcribe — faster-whisper only)
        if: github.event.inputs.type == 'transcribe'
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-transcribe.txt

      # ── RENDER: pip install full stack ────────────────────────────────────
      - name: Install Python dependencies (render — full stack)
        if: github.event.inputs.type == 'render'
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Install Node dependencies
        working-directory: ./server
        run: npm ci

      - name: Run GitHub Worker
        working-directory: ./server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORAGE_PROVIDER: b2
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          HF_HUB_CACHE: /home/runner/.cache/huggingface/hub
        run: |
          node github-worker.js --job-id "${{ github.event.inputs.jobId }}" --type "${{ github.event.inputs.type }}"
