name: Media Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'The Supabase Job ID or Project ID'
        required: true
        type: string
      type:
        description: 'The type of job to process (render or transcribe)'
        required: true
        type: choice
        options:
          - render
          - transcribe

jobs:
  process-media:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Python venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: server/venv
          # Cache key depends on both requirements files and OS
          key: ${{ runner.os }}-venv-${{ hashFiles('server/requirements*.txt') }}


      # Cache the faster-whisper 'tiny' model.
      # Stable key — only busts when model name changes.
      - name: Cache faster-whisper model
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-tiny
          key: whisper-model-tiny-v1

      - name: Verify Model Cache Hit
        if: github.event.inputs.type == 'transcribe'
        run: |
          if [ "${{ steps.cache-whisper.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Tiny model cache restored successfully."
          else
            echo "⚠️ Tiny model cache missed. Model will be downloaded."
          fi

      # ── TRANSCRIBE: no system deps needed ─────────────────────────────────
      # Chrome/Puppeteer system deps (libnss3, libasound2t64, etc.) are only
      # needed for render jobs. Skipping them saves ~12s on transcription runs.
      # FFmpeg is also not needed because we use ffmpeg-static via npm.

      # ── RENDER: FFmpeg + full Chrome deps ─────────────────────────────────
      - name: Install system dependencies (render — FFmpeg + Chrome)
        if: github.event.inputs.type == 'render'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      # ── TRANSCRIBE: pip install only faster-whisper (~50MB) ─────────────────
      # Skips mediapipe + opencv (~400MB) which are only needed for render.
      - name: Install Python dependencies (transcribe — faster-whisper only)
        if: github.event.inputs.type == 'transcribe' && steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv server/venv
          server/venv/bin/python -m pip install --upgrade pip
          server/venv/bin/pip install -r server/requirements-transcribe.txt

      # ── RENDER: pip install full stack ────────────────────────────────────
      - name: Install Python dependencies (render — full stack)
        if: github.event.inputs.type == 'render' && steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv server/venv
          server/venv/bin/python -m pip install --upgrade pip
          server/venv/bin/pip install -r server/requirements.txt

      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('server/package-lock.json') }}

      - name: Install Node dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./server
        run: npm ci

      - name: Run GitHub Worker
        working-directory: ./server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORAGE_PROVIDER: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          HF_HUB_CACHE: /home/runner/.cache/huggingface/hub
        run: |
          # Use the venv node_modules and python explicitly
          export PATH="$(pwd)/venv/bin:$PATH"
          node github-worker.js --job-id "${{ github.event.inputs.jobId }}" --type "${{ github.event.inputs.type }}"
